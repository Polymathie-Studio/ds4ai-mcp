name: Publish

# Publishes @polymathie/ds4ai to JSR using GitHub OIDC (no token). JSR
# authorizes this via the GitHub repository linked in the package's JSR
# settings. Runs on every push to main; jsr publish is a no-op when the
# version in deno.json is already published, so it only publishes on a bump.
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for JSR OIDC authentication
    steps:
      - uses: actions/checkout@v6
      - name: Publish package
        run: npx --yes jsr publish
